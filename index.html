 S.cq=Object.assign({ids:list.map(q=>q.id),qi:0,score:0,ans:[],ord:[],done:false,t0:Date.now()},meta);
 S.last={mode:"quiz",r:meta.r,ci:meta.ci};save();go("quiz/run")}
function smartPick(L,n){const sc=q=>(S.missed[q.id]?0:S.seen[q.id]?2:1)+Math.random();return[...L].sort((a,b)=>sc(a)-sc(b)).slice(0,n)}
function practise(r,t){startQuiz(shuf(smartPick(qpool(r,chIdx(r,t)),10)),{r,ci:String(chIdx(r,t)),label:D(r).name+" – "+t})}
/* ---------- HOME ---------- */

 let cont="";
 if(S.cq&&!S.cq.done)cont=`<div class="card"><h3>▶ Continue where you left off</h3><p class="mut">Quiz · ${esc(S.cq.label||"")} · question ${S.cq.qi+1}/${S.cq.ids.length} · score ${S.cq.score}</p><button class="primary" data-go="quiz/run">Resume quiz</button></div>`;
 else if(S.cq&&S.cq.done&&S.cq.ids.length)cont=`<div class="card"><h3>▶ Continue where you left off</h3><p class="mut">Last quiz · ${esc(S.cq.label||"")} · ${S.cq.score}/${S.cq.ids.length} (${Math.round(100*S.cq.score/S.cq.ids.length)}%)</p><div class="row l"><button class="primary" id="again">New quiz on the same selection</button><button data-go="quiz/run">See results</button></div></div>`;
 else if(S.lc&&FCdeck().length)cont=`<div class="card"><h3>▶ Continue where you left off</h3><p class="mut">Flashcards · ${esc(D(S.lc.r).name)}${S.lc.ci!==""?" – "+esc(D(S.lc.r).topics[+S.lc.ci]):""} · card ${S.lc.i+1}/${FCdeck().length}</p><button class="primary" data-go="cards">Resume flashcards</button></div>`;
 else if(S.last&&S.last.mode=="study"&&D(S.last.r))cont=`<div class="card"><h3>▶ Continue where you left off</h3><p class="mut">Study · ${esc(D(S.last.r).name)} – ${esc(D(S.last.r).topics[+S.last.ci]||"")}</p><button class="primary" data-go="study/${S.last.r}/${S.last.ci}">Open chapter</button></div>`;
 else cont=`<div class="card"><h3>👋 Welcome, Kiran</h3><p class="mut">${NQ} questions and ${NF} flashcards across ${REG.length} sections and ${NCH} chapters. Start with a quick quiz or open a chapter in Study.</p></div>`;
 v.innerHTML=cont+`<div class="grid"><div class="stat"><b>🔥 ${st}</b>day streak<br><small class="mut">best ${bestStreak()}</small></div><div class="stat"><b>${td}/${g}</b>today's goal<div class="bar" style="margin-top:6px"><div style="width:${Math.min(100,100*td/g)}%"></div></div><small class="mut">${td>=g?"Goal reached 🎉":(g-td)+" questions to go"}</small></div><div class="stat"><b>${tot.n?Math.round(100*tot.c/tot.n)+"%":"–"}</b>accuracy<br><small class="mut">${tot.n} answered</small></div><div class="stat"><b>${Object.keys(S.seen).filter(id=>byId[id]).length}</b>of ${NQ} seen</div></div>
 <h2>⚡ Quick start</h2><div class="row l"><button class="primary" id="q10">Quick 10 (mixed)</button><button data-go="quiz">Custom quiz</button><button id="rmiss">Review missed (${Object.keys(S.missed).filter(i=>byId[i]).length})</button><button data-go="bm">★ Bookmarks (${Object.keys(S.bm.q).length+Object.keys(S.bm.f).length})</button><button data-go="search">🔍 Search</button></div>
 <h2>🎯 Weak topics</h2>`+(w.length?`<div class="card">`+w.map(x=>`<div class="li"><span class="t"><b>${esc(x.t)}</b><br><small class="mut">${esc(D(x.r).name)} · ${Math.round(100*x.p)}% of ${x.x.n} correct</small></span><button data-prac="${x.r}|${chIdx(x.r,x.t)}">Practise</button></div>`).join("")+`</div>`:`<p class="mut card">No weak topics yet – a topic shows up here once you have answered at least 3 of its questions with under 80% correct.</p>`)+
 `<h2>📚 Sections</h2><div class="card">`+REG.map(r=>`<a class="li" href="#/study/${r}"><span class="t"><b>${esc(D(r).name)}</b><br><small class="mut">${esc(D(r).vol)} · ${D(r).topics.length} chapters · ${D(r).mcq.length} Q · ${D(r).fc.length} cards</small></span>›</a>`).join("")+`</div>`;
 const ag=$("#again");if(ag)ag.onclick=()=>{QS.r=S.cq.r;QS.ci=S.cq.ci==null?"":String(S.cq.ci);S.cq=null;save();go("quiz")};
 $("#q10").onclick=()=>startQuiz(shuf(smartPick(Object.values(byId),10)),{r:"all",ci:"",label:"Quick 10 (mixed)"});
 $("#rmiss").onclick=()=>startQuiz(shuf(Object.keys(S.missed).map(i=>byId[i]).filter(Boolean)).slice(0,50),{r:"all",ci:"",label:"Missed questions",review:true})}
/* ---------- STUDY ---------- */
function study(v){const r=REG.includes(route[1])?route[1]:null;const XL=`<div class="row l"><a class="btn" href="#/vid">▶ Videos</a><a class="btn" href="#/res">📚 Free Resources</a><a class="btn" href="#/read">📄 Offline reader</a></div>`;
 if(!r){v.innerHTML=`<h2>Study by chapter</h2><p class="mut">Chapter list follows the BD Chaurasia volumes (titles only – all notes, facts and questions here are original).</p>`+XL+`<div class="card">`+REG.map(r=>`<a class="li" href="#/study/${r}"><span class="t"><b>${esc(D(r).name)}</b><br><small class="mut">${esc(D(r).vol)} · ${D(r).topics.length} chapters</small></span>›</a>`).join("")+`</div>`;return}
 const d=D(r);
 if(route[2]!=null&&d.topics[+route[2]]!=null){const ci=+route[2],t=d.topics[ci],F=d.fc.filter(f=>f[2]==t),Q=d.mcq.filter(q=>q.t==t),x=chStat(r,t);
  S.last={mode:"study",r,ci};save();
  v.innerHTML=`<p><a href="#/study/${r}">‹ ${esc(d.name)}</a></p><h2>${ci+1}. ${esc(t)}</h2><p class="mut">${Q.length} questions · ${F.length} flashcards · ${x?pct(x)+"% of "+x.n+" correct":"not practised yet"}</p>
  <div class="row l"><button class="primary" id="cq">Quiz this chapter</button><button id="cf">Flashcards</button><a class="btn" href="#/vid/${r}/${ci}">▶ Watch (${VID(r,t).length})</a>${ci>0?`<a class="btn" href="#/study/${r}/${ci-1}">‹ Prev</a>`:""}${ci<d.topics.length-1?`<a class="btn" href="#/study/${r}/${ci+1}">Next ›</a>`:""}</div>${notes2(r,t)}
  ${(()=>{const I=d.imgs.filter(i=>i.ch==t);return I.length?`<h3>Images (${I.length})</h3><p class="mut" style="margin-top:0">Tap an image to open it full-screen; pinch or double-tap to zoom.</p>${I.map(fig).join("")}`:""})()}
  <h3>Key facts</h3><div class="card">`+F.map(f=>{const k=r+"|"+f[0];return`<div class="li" style="cursor:default"><span class="t"><b>${esc(f[0])}</b><br>${esc(f[1])}</span>${starF(k)}</div>`}).join("")+`</div>`;
  $("#cq").onclick=()=>startQuiz(shuf(smartPick(Q,S.set.qn=="All"?Q.length:Math.min(Q.length,+S.set.qn||10))),{r,ci:String(ci),label:d.name+" – "+t});
  $("#cf").onclick=()=>{S.lc={r,ci:String(ci),bmOnly:false,i:0,order:null};save();go("cards")};return}
 v.innerHTML=`<p><a href="#/study">‹ All sections</a></p><h2>${esc(d.name)}</h2><p class="mut">${esc(d.vol)} · ${d.mcq.length} questions · ${d.fc.length} flashcards</p><h3>Chapters</h3><div class="card">`+
 d.topics.map((t,i)=>{const x=chStat(r,t);return`<a class="li" href="#/study/${r}/${i}"><span class="t"><b>${i+1}. ${esc(t)}</b><br><small class="mut">${d.mcq.filter(q=>q.t==t).length} Q · ${d.fc.filter(f=>f[2]==t).length} cards${(n=>n?" · "+n+" 🖼":"")(d.imgs.filter(i=>i.ch==t).length)}${x?" · "+pct(x)+"% correct":""}</small></span>›</a>`}).join("")+`</div>`+
 (d.notes.length?`<h3>Chapter & topic summary notes (${d.notes.length})</h3>`+d.notes.map(n=>{const ci=chIdx(r,n[0]),L=TVID(r,n[0]);return`<details><summary>${ci>=0?(ci+1)+". ":""}${esc(n[0])}</summary><p>${esc(n[1])}</p>${ci>=0?`<p><a class="btn" href="#/study/${r}/${ci}">📖 Open full chapter notes</a></p>`:""}${L.length?`<div class="card">${L.map(vcard).join("")}</div>`:""}</details>`}).join(""):"")+
 (d.imgs.length?`<details><summary>🖼 Labelled images (${d.imgs.length})</summary>${d.imgs.map(fig).join("")}</details>`:"")}
/* ---------- QUIZ ---------- */
let QS={r:null,ci:"",n:null,p:"all"};
function quiz(v){if(route[1]=="run")return run(v);
 if(QS.r==null){QS.r=S.last&&S.last.r&&(S.last.r=="all"||D(S.last.r))?S.last.r:"ul";QS.ci=S.last&&S.last.r==QS.r&&S.last.ci!=null?String(S.last.ci):""}
 if(QS.n==null)QS.n=String(S.set.qn);
 const L=qpool(QS.r,QS.ci),cnt={all:L.length,unseen:L.filter(q=>!S.seen[q.id]).length,img:L.filter(q=>q.img).length,missed:L.filter(q=>S.missed[q.id]).length,bm:L.filter(q=>S.bm.q[q.id]).length};
 v.innerHTML=(S.cq&&!S.cq.done?`<div class="card">Unfinished quiz: ${esc(S.cq.label||"")} (${S.cq.qi}/${S.cq.ids.length}) <button class="primary" data-go="quiz/run">Resume</button></div>`:"")+
 `<h2>New quiz</h2><label>Section</label><select id="qr">${regOpts(QS.r,true)}</select><label>Chapter</label><select id="qc" ${QS.r=="all"?"disabled":""}>${chOpts(QS.r,QS.ci,"q")}</select>
 <label>Number of questions</label><div class="chips" id="qn">${["10","25","50","All"].map(c=>`<button class="${c==QS.n?"on":""}" data-n="${c}">${c}</button>`).join("")}</div>
 <label>Question pool</label><div class="chips" id="qp">${[["all","All"],["unseen","Unseen first"],["img","Images only"],["missed","Missed"],["bm","Bookmarked"]].map(([k,l])=>`<button class="${k==QS.p?"on":""}" data-p="${k}">${l} (${cnt[k]})</button>`).join("")}</div>
 <p class="mut">Timer: ${S.set.timer?S.set.secs+" s/question":"off"} · Explanations: ${S.set.expl=="now"?"after each answer":"at the end"} · Options ${S.set.shufOpt?"shuffled":"in fixed order"} – change in Settings.</p>
 <button class="primary big" id="go">Start quiz →</button>`;
 $("#qr").onchange=e=>{QS.r=e.target.value;QS.ci="";quiz(v)};$("#qc").onchange=e=>{QS.ci=e.target.value;quiz(v)};
 $$("#qn button").forEach(b=>b.onclick=()=>{QS.n=b.dataset.n;quiz(v)});$$("#qp button").forEach(b=>b.onclick=()=>{QS.p=b.dataset.p;quiz(v)});
 $("#go").onclick=()=>{let P=L;if(QS.p=="img")P=P.filter(q=>q.img);if(QS.p=="missed")P=P.filter(q=>S.missed[q.id]);if(QS.p=="bm")P=P.filter(q=>S.bm.q[q.id]);
  P=QS.p=="unseen"?[...shuf(P.filter(q=>!S.seen[q.id])),...shuf(P.filter(q=>S.seen[q.id]))]:shuf(P);if(QS.n!="All")P=P.slice(0,+QS.n);
  const lab=(QS.r=="all"?"All sections":D(QS.r).name)+(QS.ci!==""&&QS.r!="all"?" – "+D(QS.r).topics[+QS.ci]:"");startQuiz(P,{r:QS.r,ci:QS.ci,label:lab})}}
function run(v){const c=S.cq;if(!c){go("quiz");return}if(c.qi>=c.ids.length||c.done)return finish(v);
 const q=byId[c.ids[c.qi]];if(!q){c.qi++;save();return run(v)}
 if(!c.ord[c.qi])c.ord[c.qi]=S.set.shufOpt?shuf([0,1,2,3]):[0,1,2,3];const ord=c.ord[c.qi],a=c.ans[c.qi],done=a!==undefined&&a!==null,now=S.set.expl=="now";
 v.innerHTML=`<div class="bar"><div style="width:${100*c.qi/c.ids.length}%"></div></div><p class="pill">${esc(c.label||"")}<br>Q ${c.qi+1}/${c.ids.length}${now?" · Score "+c.score:""} · <small>${esc(q.t)}</small>${S.set.timer&&!done?`<span class="tm" id="tm">${S.set.secs}s</span>`:""}</p>
 <div class="card">${starQ(q.id)}${q.img?`<img class="qimg" src="images/${esc(q.img)}" alt="Identify">`:""}<h3>${esc(q.q)}</h3>`+
 ord.map((oi,k)=>{let cl="opt";if(done){if(now){if(oi==q.a)cl+=" ok";else if(oi==a)cl+=" bad"}else if(oi==a)cl+=" sel"}return`<button class="${cl}" data-i="${oi}" ${done?"disabled":""}>${String.fromCharCode(65+k)}. ${esc(q.o[oi])}</button>`}).join("")+
 (done?(now?`<p class="exp"><b>${a==q.a?"✔ Correct":a==-1?"⏰ Time up":"✘ Incorrect"}.</b> ${esc(q.e)}</p>`:`<p class="mut">${a==-1?"⏰ Time up – ":""}Answer saved. Explanations will be shown at the end.</p>`):"")+`</div>
 <div class="row">${done?`<button class="primary" id="nx">${c.qi+1<c.ids.length?"Next →":"Finish"}</button>`:""}<button id="quit">End quiz</button></div>`;
 const answer=i=>{if(c.ans[c.qi]!==undefined&&c.ans[c.qi]!==null)return;clearTimer();c.ans[c.qi]=i;const ok=i==q.a;if(ok)c.score++;record(q,ok);feedback(ok);save();run(v)};
 $$(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 if(done){$("#nx").onclick=()=>{c.qi++;save();run(v);toTop()};const n=$("#nx");n.scrollIntoView&&n.scrollIntoView({block:"nearest"})}
 $("#quit").onclick=()=>{if(c.qi==0&&!done||confirm("End this quiz now?")){c.ids=c.ids.slice(0,c.qi+(done?1:0));c.done=true;save();run(v)}};
 if(S.set.timer&&!done){let left=+S.set.secs||45;clearTimer();timer=setInterval(()=>{left--;const t=$("#tm");if(t){t.textContent=left+"s";t.classList.toggle("low",left<=5)}if(left<=0){clearTimer();answer(-1)}},1000)}}
function finish(v){const c=S.cq,n=c.ids.length;
 if(!c.done){c.done=true}
 if(!c.scored&&n){c.scored=true;S.qa=(S.qa||0)+1;if(!c.review&&D(c.r)){const s=S.scores[c.r]||{bestPct:0,attempts:0},p=Math.round(100*c.score/n);S.scores[c.r]={last:c.score,total:n,bestPct:Math.max(s.bestPct||0,p),attempts:(s.attempts||0)+1}}}
 save();const now=S.set.expl=="now";
 const items=c.ids.map((id,i)=>({q:byId[id],a:c.ans[i]})).filter(x=>x.q&&(!now||x.a!==x.q.a));
 v.innerHTML=`<h2>Done: ${c.score}/${n} ${n?`(${Math.round(100*c.score/n)}%)`:""}</h2><p class="mut">${esc(c.label||"")}</p>
 <div class="row l"><button class="primary" id="nq">New quiz</button>${c.ids.some((id,i)=>byId[id]&&c.ans[i]!==byId[id].a)?`<button id="rw">Retry wrong ones</button>`:""}<button data-go="home">Home</button></div>`+
 (items.length?`<h3>${now?"Review mistakes":"Review all answers"}</h3>`+items.map(({q,a})=>`<div class="card">${starQ(q.id)}<small class="mut">${esc(q.t)}</small><br><b>${esc(q.q)}</b><br>${a===q.a?"✔":"✘"} Your answer: ${a==null||a==-1?"<i>none</i>":esc(q.o[a])}<br>✔ Correct: <b>${esc(q.o[q.a])}</b><br><small>${esc(q.e)}</small></div>`).join(""):n?"<p>Perfect score! 🎉</p>":"");
 $("#nq").onclick=()=>{S.cq=null;save();go("quiz")};
 const rw=$("#rw");if(rw)rw.onclick=()=>startQuiz(shuf(c.ids.filter((id,i)=>byId[id]&&c.ans[i]!==byId[id].a).map(id=>byId[id])),{r:c.r,ci:c.ci,label:"Retry: "+(c.label||""),review:true})}
/* ---------- FLASHCARDS ---------- */
function FCbase(lc){const d=D(lc.r);if(!d)return[];let F=d.fc;if(lc.ci!==""&&lc.ci!=null)F=F.filter(f=>f[2]==d.topics[+lc.ci]);let K=F.map(f=>lc.r+"|"+f[0]);if(lc.bmOnly)K=K.filter(k=>S.bm.f[k]);return K}
function FCdeck(){const lc=S.lc;if(!lc)return[];const base=FCbase(lc),set=new Set(base);
 if(!lc.order||lc.order.length!=base.length||!lc.order.every(k=>set.has(k)))lc.order=base;return lc.order}
function cards(v){if(!S.lc||!D(S.lc.r))S.lc={r:"ul",ci:"",bmOnly:false,i:0,order:null};const lc=S.lc,deck=FCdeck();if(lc.i>=deck.length)lc.i=0;
 S.last={mode:"cards",r:lc.r,ci:lc.ci};save();
 const k=deck[lc.i],x=k&&FCK[k];
 v.innerHTML=`<label>Section</label><select id="fr">${regOpts(lc.r,false)}</select><label>Chapter</label><select id="fcs">${chOpts(lc.r,lc.ci,"f")}</select>
 <div class="tog"><span>Bookmarked cards only</span><input type="checkbox" id="fb" ${lc.bmOnly?"checked":""}></div>`+
 (x?`<p class="pill">${esc(x[1][2])} · Card ${lc.i+1}/${deck.length} – tap card to flip ${starF(k)}</p><div class="flip" id="fl"><div class="front">${esc(x[1][0])}</div><div class="back">${esc(x[1][1])}</div></div>
 <div class="row"><button id="pv">← Prev</button><button id="sh">🔀 Shuffle</button><button id="rs">↺ In order</button><button class="primary" id="nx2">Next →</button></div>`:`<p class="card mut">No cards here${lc.bmOnly?" – bookmark some cards with ☆ first":""}.</p>`);
 $("#fr").onchange=e=>{S.lc={r:e.target.value,ci:"",bmOnly:lc.bmOnly,i:0,order:null};cards(v)};
 $("#fcs").onchange=e=>{lc.ci=e.target.value;lc.i=0;lc.order=null;cards(v)};
 $("#fb").onchange=e=>{lc.bmOnly=e.target.checked;lc.i=0;lc.order=null;cards(v)};
 if(!x)return;let seenThis=false;
 const mark=()=>{if(!seenThis){seenThis=true;const d=today();S.cdays[d]=(S.cdays[d]||0)+1;save()}};
 $("#fl").onclick=()=>{$("#fl").classList.toggle("flipped");mark()};
 $("#pv").onclick=()=>{lc.i=(lc.i-1+deck.length)%deck.length;cards(v)};$("#nx2").onclick=()=>{mark();lc.i=(lc.i+1)%deck.length;cards(v)};
 $("#sh").onclick=()=>{lc.order=shuf(deck);lc.i=0;cards(v)};$("#rs").onclick=()=>{lc.order=FCbase(lc);lc.i=0;cards(v)}}
/* ---------- PROGRESS ---------- */
function prog(v){const tot=totals(),miss=Object.keys(S.missed).filter(i=>byId[i]).map(i=>byId[i]).sort((a,b)=>S.missed[b.id]-S.missed[a.id]);
 const dd=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dd.push([dkey(d),S.days[dkey(d)]||0])}const mx=Math.max(1,...dd.map(x=>x[1]));
 v.innerHTML=`<div class="grid"><div class="stat"><b>${tot.n}</b>answered</div><div class="stat"><b>${tot.n?Math.round(100*tot.c/tot.n)+"%":"–"}</b>accuracy</div><div class="stat"><b>🔥 ${streak()}</b>streak (best ${bestStreak()})</div><div class="stat"><b>${miss.length}</b>to review</div><div class="stat"><b>${S.qa||0}</b>quizzes taken</div><div class="stat"><b>${Object.keys(S.seen).length}</b>questions done</div></div>
 <h2>Weak topics</h2><div class="card">${(()=>{const W=[];REG.forEach(r=>D(r).topics.forEach(t=>{const x=chStat(r,t);if(x&&x.n>=3&&x.c/x.n<0.6)W.push({r,t,x})}));W.sort((a,b)=>a.x.c/a.x.n-b.x.c/b.x.n);return W.length?W.slice(0,10).map(w=>`<div class="tog"><span>${esc(w.t)}<br><small class="mut">${esc(D(w.r).name)} · ${pct(w.x)}% of ${w.x.n}</small></span><button class="sm" data-prac="${w.r}|${chIdx(w.r,w.t)}">Practise</button></div>`).join(""):`<p class="mut" style="margin:0">No weak topics yet – chapters with under 60% accuracy (min. 3 answers) appear here.</p>`})()}</div>
 <h2>Last 14 days</h2><div class="card"><div class="days">${dd.map(([k,n])=>`<div title="${k}: ${n}" style="height:${Math.max(2,100*n/mx)}%"></div>`).join("")}</div><small class="mut">Questions answered per day · goal ${S.set.goal}/day</small></div>
